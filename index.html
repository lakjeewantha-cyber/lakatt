<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline PDF Logger</title>

<script>
// Service Worker register (must be here)
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}
</script>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f2f2f2;
}

/* SAVE button */
.saveBtn{
    width:80%;
    height:200px;
    font-size:40px;
    background:green;
    color:white;
    border:none;
    border-radius:25px;
}

/* CLOSE button */
.closeBtn{
    position:absolute;
    top:15px;
    right:15px;
    padding:15px 25px;
    font-size:22px;
    background:red;
    color:white;
    border:none;
    border-radius:15px;
}

</style>

</head>

<body>

<button class="closeBtn" onclick="closeApp()">CLOSE</button>

<button class="saveBtn" onclick="savePDF()">SAVE PDF</button>

<!-- LOCAL FILE ONLY (NO CDN) -->
<script src="jspdf.umd.min.js"></script>

<script>

function savePDF(){

    let now = new Date();

    let dd = String(now.getDate()).padStart(2,'0');
    let mm = String(now.getMonth()+1).padStart(2,'0');
    let yy = String(now.getFullYear()).slice(-2);

    let hh = String(now.getHours()).padStart(2,'0');
    let min = String(now.getMinutes()).padStart(2,'0');

    let fileName = `${dd}${mm}${yy}_${hh}${min}.pdf`;

    const { jsPDF } = window.jspdf;

    let doc = new jsPDF();

    doc.setFontSize(20);
    doc.text(now.toLocaleString(), 20, 40);

    doc.save(fileName);
}

function closeApp(){
    document.body.innerHTML =
    "<h1 style='text-align:center;margin-top:50%;font-size:40px;'>App Closed</h1>";
}

</script>

</body>
</html>
