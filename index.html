<!DOCTYPE html>
<html>
<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}
</script>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Time Logger</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f2f2f2;
}

/* SAVE button */
.saveBtn{
    width:80%;
    height:200px;
    font-size:40px;
    background:green;
    color:white;
    border:none;
    border-radius:25px;
}

/* CLOSE button */
.closeBtn{
    position:absolute;
    top:15px;
    right:15px;
    padding:15px 25px;
    font-size:22px;
    background:red;
    color:white;
    border:none;
    border-radius:15px;
}

</style>
</head>

<body>

<!-- CLOSE BUTTON -->
<button class="closeBtn" onclick="closeApp()">
    CLOSE
</button>

<!-- SAVE BUTTON -->
<button class="saveBtn" onclick="savePDF()">
    SAVE PDF
</button>

<!-- jsPDF -->
<script src="jspdf.umd.min.js"></script>
<script>

// PDF save function
async function savePDF(){

    let now = new Date();

    // Date parts
    let dd = String(now.getDate()).padStart(2, '0');
    let mm = String(now.getMonth() + 1).padStart(2, '0');
    let yy = String(now.getFullYear()).slice(-2);

    // Time parts
    let hh = String(now.getHours()).padStart(2, '0');
    let min = String(now.getMinutes()).padStart(2, '0');

    // File name format
    let fileName = `${dd}${mm}${yy}_${hh}${min}.pdf`;

    // PDF text
    let text = now.toLocaleString();

    const { jsPDF } = window.jspdf;

    let doc = new jsPDF();

    doc.setFontSize(20);

    doc.text(text, 20, 40);

    // Save PDF
    doc.save(fileName);
}
// Close screen
function closeApp(){

    document.body.innerHTML =
    "<h1 style='text-align:center;margin-top:50%;font-size:40px;'>App Closed</h1>";
}

</script>

</body>
</html>
