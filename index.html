<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Time Logger</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f2f2f2;
}

/* SAVE button */
.saveBtn{
    width:80%;
    height:200px;
    font-size:40px;
    background:green;
    color:white;
    border:none;
    border-radius:25px;
}

/* CLOSE button */
.closeBtn{
    position:absolute;
    top:15px;
    right:15px;
    padding:15px 25px;
    font-size:22px;
    background:red;
    color:white;
    border:none;
    border-radius:15px;
}

</style>
</head>

<body>

<!-- CLOSE BUTTON -->
<button class="closeBtn" onclick="closeApp()">
    CLOSE
</button>

<!-- SAVE BUTTON -->
<button class="saveBtn" onclick="savePDF()">
    SAVE PDF
</button>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

// PDF save function
async function savePDF(){

    let now = new Date().toLocaleString();

    const { jsPDF } = window.jspdf;

    let doc = new jsPDF();

    // Font size 20
    doc.setFontSize(20);

    // Write date & time
    doc.text(now, 20, 40);

    // Save PDF
    doc.save("timelog.pdf");
}

// Close screen
function closeApp(){

    document.body.innerHTML =
    "<h1 style='text-align:center;margin-top:50%;font-size:40px;'>App Closed</h1>";
}

</script>

</body>
</html>
